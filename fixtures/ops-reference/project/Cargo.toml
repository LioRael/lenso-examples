[package]
name = "lenso-ops-reference-web"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.lenso]
plugin-id = "example.ops-web"
root-slot = "web"

[dependencies]
lenso = "=0.5.28"
example-ops-state-contract = { package = "example-ops-state-v2-contract", path = "contracts/example.ops-state-v2" }
lenso-capability-http-endpoint = "=0.3.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
exclude = ["app/state", "contracts/example.ops-state-v2"]

