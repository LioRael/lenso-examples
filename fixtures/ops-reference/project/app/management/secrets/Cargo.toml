[package]
name = "lenso-ops-reference-secrets"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.lenso]
plugin-id = "example.ops-secrets"
root-slot = "secrets"

[package.metadata.lenso.host-facilities.secrets]
native = "host_facilities::secrets"

[dependencies]
lenso = "=0.5.28"
lenso-capability-secrets = "=0.1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
