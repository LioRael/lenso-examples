lenso-capability-audit-log = { git = "https://github.com/LioRael/lenso-audit-log-plugin", rev = "8fb929d066a5ce4bc145db47a6aae0527b62f230" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[lints.rust]
unsafe_code = "forbid"
