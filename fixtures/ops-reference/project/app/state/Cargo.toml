[package]
name = "lenso-ops-reference-state"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.lenso]
plugin-id = "example.ops-state"
root-slot = "state"

[package.metadata.lenso.host-facilities.state]
native = "host_facilities::state"
workers = "host_facilities::state"
workers-adapter = "src/host_facilities/state.mjs"

[dependencies]
lenso = "=0.5.28"
example-ops-state-contract = { package = "example-ops-state-v2-contract", path = "../../contracts/example.ops-state-v2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lenso-ops-reference-pg = { path = "../../../storage/native-pg" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
lenso-test = { git = "https://github.com/LioRael/lenso", rev = "b8d134d739698812a039a79633719e14947df1e3" }
lenso-app-plan = "=0.4.6"
lenso-kernel = "=0.3.12"
lenso-native-adapter = "=0.3.19"
futures = "0.3"

[workspace]

