[package]
name = "lenso-ops-reference-secrets"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.lenso]
plugin-id = "example.ops-secrets"
root-slot = "secrets"

[package.metadata.lenso.host-facilities.secrets]
workers = "host_facilities::secrets"
workers-adapter = "src/secrets.mjs"

[dependencies]
lenso = "=0.5.28"
lenso-kernel = "=0.3.12"
lenso-capability-secrets = "=0.1.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[lints.rust]
unsafe_code = "forbid"
