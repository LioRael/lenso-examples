[package]
name = "lenso-ops-workers-owner-operator"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "wasm-bindgen"] }
zeroize = "1.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
lenso = "=0.5.28"
lenso-app-plan = "=0.4.6"
lenso-kernel = "=0.3.12"
lenso-native-adapter = "=0.3.19"
lenso-workers-driver = "=0.1.2"
lenso-capability-secrets = "=0.1.4"
lenso-auth-api-token-plugin = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "1d101fbc9ba1efc12aaa2cf459628e6383100264", default-features = false, features = ["workers"] }
lenso-auth-sdk = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "1d101fbc9ba1efc12aaa2cf459628e6383100264" }
lenso-capability-auth = { git = "https://github.com/LioRael/lenso-auth-plugin", rev = "1d101fbc9ba1efc12aaa2cf459628e6383100264" }
