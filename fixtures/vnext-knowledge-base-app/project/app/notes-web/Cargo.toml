[package]
name = "lenso-knowledge-base-reference-app"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.lenso]
plugin-id = "lenso.reference.knowledge-base"
root-slot = "web"
host-bindings = ["business-snapshot@1"]

[dependencies]
anyhow = "1"
base64 = "0.22"
lenso = "=0.5.27"
lenso-app-plan = "=0.4.6"
lenso-auth-sdk = "=0.2.3"
lenso-capability-auth = "=0.2.0"
lenso-capability-http-endpoint = "=0.3.4"
lenso-capability-agent-tool-provider = "=0.3.0"
lenso-capability-secrets = "=0.1.4"
lenso-engine-authoring = "=0.2.3"
lenso-kernel = "=0.3.11"
lenso-native-adapter = "=0.3.18"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres"] }
tokio = { version = "1", features = ["macros", "rt", "time"] }
uuid = { version = "1", features = ["v7"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[workspace]
