[package]
name = "lenso-knowledge-settings-local-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "=0.8.9"
hex = "=0.4.3"
lenso-knowledge-base-reference-app = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres"] }
subtle = "=2.6.1"
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "time"] }

[workspace]
