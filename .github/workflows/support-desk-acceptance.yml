name: support-desk-product-acceptance

on:
  workflow_dispatch:
    inputs:
      framework_ref:
        description: Exact lenso branch, tag, or commit
        required: true
        default: main
        type: string
      cli_ref:
        description: Exact lenso-cli branch, tag, or commit
        required: true
        default: main
        type: string
      console_ref:
        description: Exact lenso-console branch, tag, or commit
        required: true
        default: main
        type: string

jobs:
  black-box:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lenso_acceptance
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -d lenso_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out examples
        uses: actions/checkout@v6
        with:
          path: examples
      - name: Check out exact Framework
        uses: actions/checkout@v6
        with:
          repository: LioRael/lenso
          ref: ${{ inputs.framework_ref }}
          path: framework
      - name: Check out exact CLI
        uses: actions/checkout@v6
        with:
          repository: LioRael/lenso-cli
          ref: ${{ inputs.cli_ref }}
          path: cli
      - name: Check out exact Console
        uses: actions/checkout@v6
        with:
          repository: LioRael/lenso-console
          ref: ${{ inputs.console_ref }}
          path: console
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: examples/package.json
          run_install: false
      - uses: actions/setup-node@v6
        with:
          cache: pnpm
          cache-dependency-path: examples/pnpm-lock.yaml
          node-version: 24
      - name: Install acceptance dependencies
        working-directory: examples
        run: pnpm install --frozen-lockfile
      - name: Install browser
        working-directory: examples
        run: pnpm exec playwright-cli install-browser chromium
      - name: Run the black-box Support Desk product acceptance
        working-directory: examples
        env:
          LENSO_ACCEPTANCE_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/lenso_acceptance?sslmode=disable
          LENSO_ACCEPTANCE_KEEP_TEMP: "1"
          LENSO_CLI_ROOT: ${{ github.workspace }}/cli
          LENSO_CONSOLE_ROOT: ${{ github.workspace }}/console
          LENSO_FRAMEWORK_ROOT: ${{ github.workspace }}/framework
        run: pnpm acceptance:support-desk
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: support-desk-browser-evidence
          path: /tmp/lenso-support-desk-*/evidence
