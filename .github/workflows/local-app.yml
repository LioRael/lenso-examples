name: Local App consumer proof

on:
  pull_request:
  push:
    branches: [main, "candidate/**"]

permissions:
  contents: read

jobs:
  local-app:
    name: Offline mixed local App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Test tooling is pinned to the reviewed consolidated Rust candidate.
      - uses: actions/checkout@v6
        with:
          repository: LioRael/lenso
          ref: 8e6eb5eb9f468959eea713eab5f20592dfe65a71
          path: .lenso-ci-cli
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .lenso-ci-cli
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: cargo build --locked --manifest-path .lenso-ci-cli/Cargo.toml --bin lenso
      - run: cargo fmt --manifest-path fixtures/vnext-knowledge-base-app/project/app/notes-web/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path fixtures/vnext-knowledge-base-app/project/app/notes-web/Cargo.toml
      - run: python3 fixtures/vnext-knowledge-base-app/verify.py --cli "$PWD/.lenso-ci-cli/target/debug/lenso"
      - run: cargo fmt --manifest-path fixtures/vnext-local-app/project/app/web/Cargo.toml -- --check
      - run: cargo fmt --manifest-path fixtures/vnext-local-app/shared-plugins/audit/Cargo.toml -- --check
      - run: python3 fixtures/vnext-local-app/verify.py --cli "$PWD/.lenso-ci-cli/target/debug/lenso"
      - run: cargo fmt --manifest-path fixtures/vnext-typed-local-app/project/app/web/Cargo.toml -- --check
      - run: cargo fmt --manifest-path fixtures/vnext-typed-local-app/project/contracts/text/Cargo.toml -- --check
      - run: python3 fixtures/vnext-typed-local-app/verify.py --cli "$PWD/.lenso-ci-cli/target/debug/lenso"
