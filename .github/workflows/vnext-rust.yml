name: vNext Rust examples

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --cwd fixtures/vnext-web-ui --frozen-lockfile
      - run: bun install --cwd fixtures/vnext-plugin-authoring-v2/typescript --frozen-lockfile
      - run: cargo fmt --all -- --check
      - name: Check generated Capability contracts
        run: cargo install lenso-contract-codegen --version 0.6.5 --locked && lenso-contract-codegen workspace check --manifest-path Cargo.toml
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - name: Check Plugin authoring v2 generated contracts
        run: |
          cargo install lenso-contract-codegen --version 0.8.2 --locked --force
          lenso-contract-codegen workspace check --manifest-path fixtures/vnext-plugin-authoring-v2/Cargo.toml
          lenso-contract-codegen check fixtures/vnext-plugin-authoring-v2/capabilities/document-store/capability.json --rust-plugin fixtures/vnext-plugin-authoring-v2/src/generated/document_store.rs
          lenso-contract-codegen check fixtures/vnext-plugin-authoring-v2/capabilities/document-store/capability.json --typescript fixtures/vnext-plugin-authoring-v2/typescript/generated/document-store.ts
          lenso-contract-codegen check fixtures/vnext-plugin-authoring-v2/capabilities/document-sync/capability.json --rust-plugin fixtures/vnext-plugin-authoring-v2/src/generated/document_sync.rs
          lenso-contract-codegen check fixtures/vnext-plugin-authoring-v2/capabilities/document-sync/capability.json --typescript fixtures/vnext-plugin-authoring-v2/typescript/generated/document-sync.ts
      - run: cargo fmt --manifest-path fixtures/vnext-plugin-authoring-v2/Cargo.toml --all -- --check
      - run: cargo check --locked --manifest-path fixtures/vnext-plugin-authoring-v2/Cargo.toml --workspace --all-targets
      - run: cargo test --locked --manifest-path fixtures/vnext-plugin-authoring-v2/Cargo.toml --workspace
      - run: bun run --cwd fixtures/vnext-plugin-authoring-v2/typescript check
      - name: Run installable mixed-language Plugin conformance
        run: |
          cargo install lenso-cli --version 0.5.0 --locked
          lenso plugin check --repo-root fixtures/vnext-plugin-authoring-v2 --json
          lenso plugin pack --repo-root fixtures/vnext-plugin-authoring-v2 --json
          app_root="$(mktemp -d)"
          mkdir -p "$app_root/.lenso" "$app_root/plugins"
          cp fixtures/vnext-plugin-authoring-v2/host-catalog.json "$app_root/.lenso/host-catalog.json"
          printf 'document = "guide"\nruleset = "identity-v1"\n' > "$app_root/config.toml"
          lenso plugins add fixtures/vnext-plugin-authoring-v2/dist/example.document-sync-0.1.0.lenso-plugin --root "$app_root"
          lenso plugins configure example.document-sync default --file "$app_root/config.toml" --root "$app_root"
          lenso plugins list --root "$app_root" | grep 'example.document-sync/default.*PluginRoot'
          extract_root="$(mktemp -d)"
          unzip -q fixtures/vnext-plugin-authoring-v2/dist/example.document-sync-0.1.0.lenso-plugin -d "$extract_root"
          LENSO_DOCUMENT_SYNC_BUN_ARTIFACT="$extract_root/implementations/typescript-bun/plugin.js" \
            cargo test --locked --manifest-path fixtures/vnext-plugin-authoring-v2/Cargo.toml \
              --test process_sync typescript_bun_syncs_through_the_same_named_host_dependencies \
              -- --ignored --test-threads=1
      - name: Run target-owned Web UI conformance
        run: cargo test --locked -p lenso-vnext-web-ui --test web_ui generated_browser_client_invokes_the_allowlisted_app_capability -- --ignored --test-threads=1
