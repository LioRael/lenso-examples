name: vNext Rust examples

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["candidate/**"]

permissions: {}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --cwd fixtures/vnext-web-ui --frozen-lockfile
      - run: bun install --cwd fixtures/vnext-plugin-authoring-v2/typescript --frozen-lockfile
      - run: cargo fmt --all -- --check
      - name: Check generated Capability contracts
        run: cargo install lenso-contract-codegen --version 0.6.5 --locked && lenso-contract-codegen workspace check --manifest-path Cargo.toml
      - run: cargo check --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      - name: Check Plugin authoring v2 generated contracts
        run: |
          cargo install lenso-contract-codegen --version 0.8.2 --locked --force
          lenso-contract-codegen workspace check --manifest-path fixtures/vnext-plugin-authoring-v2/Cargo.toml
          lenso-contract-codegen check fixtures/vnext-plugin-authoring-v2/capabilities/document-store/capability.json --rust-plugin fixtures/vnext-plugin-authoring-v2/src/generated/document_store.rs
          lenso-contract-codegen check fixtures/vnext-plugin-authoring-v2/capabilities/document-store/capability.json --typescript fixtures/vnext-plugin-authoring-v2/typescript/generated/document-store.ts
          lenso-contract-codegen check fixtures/vnext-plugin-authoring-v2/capabilities/document-sync/capability.json --rust-plugin fixtures/vnext-plugin-authoring-v2/src/generated/document_sync.rs
          lenso-contract-codegen check fixtures/vnext-plugin-authoring-v2/capabilities/document-sync/capability.json --typescript fixtures/vnext-plugin-authoring-v2/typescript/generated/document-sync.ts
      - run: cargo fmt --manifest-path fixtures/vnext-plugin-authoring-v2/Cargo.toml --all -- --check
      - run: cargo check --locked --manifest-path fixtures/vnext-plugin-authoring-v2/Cargo.toml --workspace --all-targets
      - run: cargo test --locked --manifest-path fixtures/vnext-plugin-authoring-v2/Cargo.toml --workspace
      - run: bun run --cwd fixtures/vnext-plugin-authoring-v2/typescript check
      - name: Run released Plugin authoring acceptance
        working-directory: fixtures/vnext-plugin-authoring-v2
        run: |
          npx --yes @lenso/cli@0.17.4 plugin check --repo-root . --json
          npx --yes @lenso/cli@0.17.4 plugin pack --repo-root . --output document-sync.lenso-plugin --json
          npx --yes @lenso/cli@0.17.4 app build --source acceptance/host.ts --target x86_64-unknown-linux-gnu --out /tmp/document-sync-host
          npx --yes @lenso/cli@0.17.4 plugins add document-sync.lenso-plugin --root /tmp/document-sync-host
          npx --yes @lenso/cli@0.17.4 app show --root /tmp/document-sync-host --json
          npx --yes @lenso/cli@0.17.4 plugins remove example.document-sync --root /tmp/document-sync-host
          npx --yes @lenso/cli@0.17.4 app check --root /tmp/document-sync-host
          app_root="$(mktemp -d)"
          mkdir -p "$app_root/.lenso" "$app_root/plugins"
          cp host-catalog.json "$app_root/.lenso/host-catalog.json"
          printf 'document = "guide"\nruleset = "identity-v1"\n' > "$app_root/config.toml"
          npx --yes @lenso/cli@0.17.4 plugins add document-sync.lenso-plugin --root "$app_root"
          npx --yes @lenso/cli@0.17.4 plugins configure example.document-sync default --file "$app_root/config.toml" --root "$app_root"
          npx --yes @lenso/cli@0.17.4 plugins list --root "$app_root" | grep 'example.document-sync/default.*PluginRoot'
          mkdir /tmp/document-sync-bundle
          unzip -q document-sync.lenso-plugin -d /tmp/document-sync-bundle
          LENSO_DOCUMENT_SYNC_BUN_ARTIFACT=/tmp/document-sync-bundle/implementations/typescript-bun/plugin.js \
            cargo test --locked -p lenso-vnext-plugin-authoring-v2 --test process_sync \
             typescript_bun_syncs_through_the_same_named_host_dependencies -- --ignored --exact --test-threads=1
      - name: Run target-owned Web UI conformance
        run: cargo test --locked -p lenso-vnext-web-ui --test web_ui generated_browser_client_invokes_the_allowlisted_app_capability -- --ignored --test-threads=1

  portable-settings:
    name: Portable Native and Workers settings proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: LioRael/lenso
          ref: 3e591ffaed80f62cf4eb4c2f8e522dafeea0caf9
          path: .lenso-framework
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: LioRael/lenso-js
          ref: b2b3122f0061a649de29d1fa6d7c2fb30076f3a7
          path: .lenso-js-runtime
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
      - name: Install isolated PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Check fixture formatting
        run: cargo fmt --manifest-path fixtures/vnext-portable-settings/Cargo.toml --all -- --check
      - name: Install fixture-pinned JavaScript tools
        working-directory: fixtures/vnext-portable-settings
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version '=0.2.127' --locked
      - name: Extract pinned Workers clock source
        run: |
          mkdir -p "$RUNNER_TEMP/lenso-js-runtime"
          git -C .lenso-js-runtime archive b2b3122f0061a649de29d1fa6d7c2fb30076f3a7 \
            packages/lenso-workers-runtime | tar -x -C "$RUNNER_TEMP/lenso-js-runtime"
      - name: Verify Plugin-owned Component bridge and receipts
        working-directory: fixtures/vnext-knowledge-base-app
        run: |
          python3 -m unittest test_verify_workers_settings.py test_verify_workers_settings_tunnel.py test_verify_workers_settings_mux.py test_verify_browser_handoff.py
          python3 project/app/notes-web/workers-host/test_prepare_integration.py
          python3 project/app/notes-web/workers-host/test_bridge.py --lenso-js "$RUNNER_TEMP/lenso-js-runtime"
      - name: Test verifier framework-source preflight
        working-directory: fixtures/vnext-portable-settings
        run: python3 -m unittest test_verify.py
      - name: Check Worker module syntax
        working-directory: fixtures/vnext-portable-settings
        run: node --check body.mjs && node --check worker.mjs && node --check workerd-test.mjs
      - name: Build and exercise both targets against the exact framework source
        working-directory: fixtures/vnext-portable-settings
        env:
          LENSO_FRAMEWORK_ROOT: ${{ github.workspace }}/.lenso-framework
          LENSO_FRAMEWORK_REVISION: 3e591ffaed80f62cf4eb4c2f8e522dafeea0caf9
          LENSO_WORKERS_RUNTIME_ROOT: ${{ runner.temp }}/lenso-js-runtime/packages/lenso-workers-runtime
          WRANGLER_SEND_METRICS: 'false'
        run: python3 test_durable.py --workers
