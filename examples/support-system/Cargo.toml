[package]
name = "lenso-example-support-system"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "support-system-workload"
path = "src/bin/workload.rs"

[[bin]]
name = "support-system-smoke"
path = "src/bin/smoke.rs"

[[bin]]
name = "support-system-m2-smoke"
path = "src/bin/m2_smoke.rs"

[[bin]]
name = "support-system-m3-smoke"
path = "src/bin/m3_smoke.rs"

[[bin]]
name = "support-system-m4-smoke"
path = "src/bin/m4_smoke.rs"

[[bin]]
name = "support-system-m5-smoke"
path = "src/bin/m5_smoke.rs"

[[bin]]
name = "support-system-m5-data-plane"
path = "src/bin/m5_data_plane.rs"

[[bin]]
name = "support-system-m5-canary-step"
path = "src/bin/m5_canary_step.rs"

[[bin]]
name = "support-system-m5-coordination-resume"
path = "src/bin/m5_coordination_resume.rs"

[dependencies]
anyhow = "1"
async-nats = "0.49"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
http = "1"
http-body-util = "0.1"
lenso-autonomous-service = { path = "../../../lenso/crates/lenso-autonomous-service" }
lenso-contracts = { path = "../../../lenso/crates/lenso-contracts" }
lenso-service = { path = "../../../lenso/crates/lenso-service" }
platform-core = { package = "lenso-platform-core", path = "../../../lenso/crates/platform-core" }
platform-runtime = { package = "lenso-platform-runtime", path = "../../../lenso/crates/platform-runtime" }
platform-testing = { package = "lenso-platform-testing", path = "../../../lenso/crates/platform-testing" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki"] }
story = { package = "lenso-module-story", path = "../../../lenso/modules/story" }
tokio = { version = "1.52", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["channel", "router", "server"] }
tower = "0.5"
utoipa-axum = "0.2"
uuid = { version = "1", features = ["v7"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[lints.rust]
unsafe_code = "forbid"
